<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Reveal Feed</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --accent: #ff4d00;
    --accent2: #ff9500;
    --bg: #000;
    --h: 100dvh;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    touch-action: pan-y;
  }

  /* ── FEED CONTAINER ── */
  #feed {
    width: 100%;
    height: var(--h);
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  #feed::-webkit-scrollbar { display: none; }

  /* ── SLIDE ── */
  .slide {
    width: 100%;
    height: var(--h);
    scroll-snap-align: start;
    position: relative;
    overflow: hidden;
    background: #000;
  }

  /* ── VIDEO WRAPPER — this is what gets translateX for reveal ── */
  .vid-wrap {
    position: absolute;
    top: 0; left: 0;
    /* wider than viewport to hide left/right content */
    /* actual width set by JS based on aspect ratio */
    height: 100%;
    will-change: transform;
    transition: none; /* JS-driven, no CSS transition */
  }

  .vid-wrap video,
  .vid-wrap .placeholder {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }

  /* placeholder color cards for demo */
  .placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    font-weight: 900;
    color: rgba(255,255,255,0.15);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  /* ── GRADIENT OVERLAY ── */
  .overlay {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 45%),
      linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, transparent 20%);
    pointer-events: none;
    z-index: 2;
  }

  /* ── REVEAL INDICATOR ── */
  .reveal-bar {
    position: absolute;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 6px;
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
  }
  .reveal-bar.visible { opacity: 1; }

  .reveal-track {
    width: 80px; height: 3px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }
  .reveal-thumb {
    position: absolute;
    top: 0; height: 100%;
    width: 24px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: none;
  }
  .reveal-icon {
    width: 18px; height: 18px;
    opacity: 0.7;
  }

  /* ── SIDE ACTIONS ── */
  .actions {
    position: absolute;
    right: 12px;
    bottom: 120px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: center;
  }

  .action-btn {
    width: 46px; height: 46px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: transform 0.15s, background 0.2s;
    color: white;
  }
  .action-btn:active { transform: scale(0.88); }
  .action-btn.active {
    background: rgba(255,77,0,0.35);
    border-color: rgba(255,77,0,0.7);
    box-shadow: 0 0 14px rgba(255,77,0,0.4);
    color: var(--accent);
  }
  .action-btn svg { width: 20px; height: 20px; }

  /* ── REVEAL BUTTON (gyro toggle) ── */
  #reveal-toggle {
    background: rgba(0,0,0,0.5);
    border: 1.5px solid rgba(255,255,255,0.25);
    color: rgba(255,255,255,0.8);
  }
  #reveal-toggle.active {
    background: rgba(255,77,0,0.35);
    border-color: rgba(255,149,0,0.8);
    color: var(--accent2);
    box-shadow: 0 0 18px rgba(255,100,0,0.5);
    animation: pulse-ring 1.8s infinite;
  }
  @keyframes pulse-ring {
    0%   { box-shadow: 0 0 0 0 rgba(255,100,0,0.4), 0 0 18px rgba(255,100,0,0.5); }
    70%  { box-shadow: 0 0 0 8px rgba(255,100,0,0), 0 0 18px rgba(255,100,0,0.5); }
    100% { box-shadow: 0 0 0 0 rgba(255,100,0,0), 0 0 18px rgba(255,100,0,0.5); }
  }

  /* ── CAPTION ── */
  .caption {
    position: absolute;
    bottom: 28px; left: 16px; right: 70px;
    z-index: 10;
    color: white;
  }
  .caption h2 {
    font-size: 15px; font-weight: 700;
    line-height: 1.35;
    text-shadow: 0 1px 6px rgba(0,0,0,0.7);
    margin-bottom: 4px;
  }
  .caption p {
    font-size: 12px;
    color: rgba(255,255,255,0.65);
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }

  /* ── SENSOR DENIED BANNER ── */
  #sensor-banner {
    display: none;
    position: fixed;
    top: 60px; left: 50%;
    transform: translateX(-50%);
    background: rgba(30,30,30,0.95);
    border: 1px solid rgba(255,77,0,0.5);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 12px;
    color: rgba(255,255,255,0.8);
    z-index: 100;
    text-align: center;
    max-width: 260px;
    backdrop-filter: blur(8px);
  }
  #sensor-banner.show { display: block; }

  /* ── REVEAL FLASH ── */
  .reveal-flash {
    position: absolute;
    inset: 0; z-index: 3;
    background: linear-gradient(90deg, rgba(255,149,0,0.06), transparent 30%, transparent 70%, rgba(255,77,0,0.06));
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .reveal-flash.active { opacity: 1; }

  /* ── TILT HINT ── */
  #tilt-hint {
    position: fixed;
    bottom: 50%;
    left: 50%;
    transform: translate(-50%, 50%);
    z-index: 200;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s;
  }
  #tilt-hint.show { opacity: 1; }
  #tilt-hint .hint-icon {
    width: 60px; height: 60px;
    margin: 0 auto 8px;
    animation: tilt-anim 1.5s ease-in-out infinite alternate;
  }
  #tilt-hint p {
    color: rgba(255,255,255,0.8);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  @keyframes tilt-anim {
    0%   { transform: rotate(-30deg); }
    100% { transform: rotate(30deg); }
  }
</style>
</head>
<body>

<div id="sensor-banner">📳 Tilt sensor unavailable.<br>Drag left/right to reveal instead.</div>
<div id="tilt-hint"></div>
<div id="feed"></div>

<!-- Fixed reveal toggle button -->
<button id="reveal-toggle" class="action-btn" onclick="toggleReveal()" title="Toggle Reveal Mode" style="position:fixed;right:12px;top:50%;transform:translateY(-50%);z-index:50;">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
    <circle cx="12" cy="12" r="3"/>
    <line x1="1" y1="1" x2="23" y2="23" id="reveal-cross" style="display:none"/>
  </svg>
</button>

<script>
// ═══════════════════════════════════════════════════
// DATA — swap src for real video URLs
// ═══════════════════════════════════════════════════
const SLIDES = [
  { id:1, src:'', color:'linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)', label:'Urban Nights', sub:'Swipe • Tilt to Reveal' },
  { id:2, src:'', color:'linear-gradient(135deg,#0d0d0d,#1b1b2f,#162447)', label:'Ocean Drive', sub:'@creator · 2.1M views' },
  { id:3, src:'', color:'linear-gradient(135deg,#0a0a0a,#1c1c1c,#2d1b00)', label:'Sunset Boulevard', sub:'#travel #cinematic' },
  { id:4, src:'', color:'linear-gradient(135deg,#050505,#0e1628,#1a0533)', label:'Neon Tokyo', sub:'Reveal hidden story →' },
  { id:5, src:'', color:'linear-gradient(135deg,#0a1628,#061020,#000)', label:'Deep Space', sub:'Tilt your phone' },
];

// ═══════════════════════════════════════════════════
// REVEAL ENGINE
// ═══════════════════════════════════════════════════

// How much wider the video is vs the viewport (portrait width).
// A 16:9 video on a 9:19.5 portrait = 16/9 * 9/19.5 ≈ 0.82 * screen_height
// The "hidden" portion on each side = (WIDE_RATIO - 1) / 2 of viewport width
const WIDE_RATIO = 1.78; // 16:9 ÷ 9:16 ≈ 1.78× wider than portrait slot

// Reveal state
let revealActive = false;
let currentOffset = 0;   // actual current offset (-1 to 1)
let targetOffset  = 0;   // sensor target
let rafId = null;
let sensorAvail = false;
let baseGamma = null;     // calibration baseline

// Touch fallback
let touchStartX = 0;
let touchDragging = false;

// Per-slide wrap elements (for applying transform)
const wrapEls = [];
const flashEls = [];
const barThumbEls = [];
const barEls = [];

// ── Build feed ──────────────────────────────────────
function buildFeed() {
  const feed = document.getElementById('feed');
  SLIDES.forEach((s, i) => {
    const slide = document.createElement('div');
    slide.className = 'slide';
    slide.dataset.idx = i;

    // vid-wrap: 178% wide, centered
    const wrap = document.createElement('div');
    wrap.className = 'vid-wrap';
    wrap.style.width  = `${WIDE_RATIO * 100}%`;
    wrap.style.left   = `${-(WIDE_RATIO - 1) / 2 * 100}%`; // centered
    wrapEls[i] = wrap;

    if (s.src) {
      const vid = document.createElement('video');
      vid.src = s.src;
      vid.loop = vid.playsInline = vid.muted = true;
      vid.setAttribute('playsinline','');
      wrap.appendChild(vid);
    } else {
      const ph = document.createElement('div');
      ph.className = 'placeholder';
      ph.style.background = s.color;
      ph.innerHTML = `<span>${i+1}</span>`;
      wrap.appendChild(ph);
    }

    const flash = document.createElement('div');
    flash.className = 'reveal-flash';
    flashEls[i] = flash;

    slide.appendChild(wrap);
    slide.appendChild(flash);
    slide.appendChild(Object.assign(document.createElement('div'), {className:'overlay'}));

    // Reveal progress bar
    const bar = document.createElement('div');
    bar.className = 'reveal-bar';
    bar.innerHTML = `
      <svg class="reveal-icon" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      <div class="reveal-track"><div class="reveal-thumb" id="thumb-${i}"></div></div>
      <svg class="reveal-icon" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>`;
    barEls[i] = bar;
    barThumbEls[i] = null; // filled after append
    slide.appendChild(bar);

    // Caption
    const cap = document.createElement('div');
    cap.className = 'caption';
    cap.innerHTML = `<h2>${s.label}</h2><p>${s.sub}</p>`;
    slide.appendChild(cap);

    feed.appendChild(slide);
    barThumbEls[i] = document.getElementById(`thumb-${i}`);
  });

  // Autoplay first visible
  playVisible();
  observeSlides();
}

// ── IntersectionObserver for autoplay ───────────────
function observeSlides() {
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      const vid = e.target.querySelector('video');
      if (!vid) return;
      if (e.isIntersecting) vid.play().catch(()=>{});
      else { vid.pause(); vid.currentTime = 0; }
    });
  }, { threshold: 0.6 });
  document.querySelectorAll('.slide').forEach(s => obs.observe(s));
}

function playVisible() {
  const feed = document.getElementById('feed');
  const idx = Math.round(feed.scrollTop / window.innerHeight);
  document.querySelectorAll('.slide').forEach((s, i) => {
    const vid = s.querySelector('video');
    if (!vid) return;
    if (i === idx) vid.play().catch(()=>{});
    else { vid.pause(); vid.currentTime = 0; }
  });
}

// ═══════════════════════════════════════════════════
// GYROSCOPE / SENSOR ENGINE
// ═══════════════════════════════════════════════════

let sensorStarted = false;

function startSensors() {
  if (sensorStarted) return;
  sensorStarted = true;

  if (typeof DeviceOrientationEvent === 'undefined') {
    onSensorUnavailable('No sensor API'); return;
  }

  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission()
      .then(state => {
        if (state === 'granted') listenOrientation();
        else onSensorUnavailable('Permission denied');
      })
      .catch(() => onSensorUnavailable('Permission error'));
  } else {
    listenOrientation();
  }
}

function listenOrientation() {
  let confirmedWorking = false;
  let failTimer = null;
  let eventCount = 0;

  const handler = (e) => {
    eventCount++;
    const dbg = document.getElementById('dbg');
    if (dbg) dbg.textContent =
      `#${eventCount} | a:${e.alpha!=null?e.alpha.toFixed(1):'null'} b:${e.beta!=null?e.beta.toFixed(1):'null'} g:${e.gamma!=null?e.gamma.toFixed(1):'null'}`;

    if (e.gamma === null || e.gamma === undefined) return;
    if (!confirmedWorking) {
      confirmedWorking = true;
      sensorAvail = true;
      clearTimeout(failTimer);
    }
    if (!revealActive) return;
    const gamma = e.gamma;
    if (baseGamma === null) baseGamma = gamma;
    const delta = gamma - baseGamma;
    targetOffset = Math.max(-1, Math.min(1, delta / 35));
  };

  window.addEventListener('deviceorientation', handler, { passive: true });

  window._startSensorCheck = () => {
    if (!confirmedWorking) {
      failTimer = setTimeout(() => {
        if (!confirmedWorking) onSensorUnavailable('No gamma data');
      }, 2000);
    }
  };
}

function onSensorUnavailable(reason) {
  console.warn('Sensor unavailable:', reason);
  sensorAvail = false;
  const banner = document.getElementById('sensor-banner');
  banner.classList.add('show');
  setTimeout(() => banner.classList.remove('show'), 4000);
}

// ── RAF loop for smooth interpolation ───────────────
function startRafLoop() {
  const LERP = 0.08; // smoothing (lower = smoother/laggier, higher = snappier)

  function loop() {
    if (revealActive) {
      // Lerp toward target
      currentOffset += (targetOffset - currentOffset) * LERP;

      // Apply to ALL visible slides (or just current, your choice)
      applyReveal(currentOffset);
    } else {
      // Smoothly return to center
      if (Math.abs(currentOffset) > 0.001) {
        currentOffset += (0 - currentOffset) * LERP;
        applyReveal(currentOffset);
      } else if (currentOffset !== 0) {
        currentOffset = 0;
        applyReveal(0);
      }
    }
    rafId = requestAnimationFrame(loop);
  }
  loop();
}

function applyReveal(offset) {
  // offset: -1 = full left, 0 = center, +1 = full right
  // Max translateX = (WIDE_RATIO - 1)/2 * 100 / WIDE_RATIO % of wrap width
  // Since wrap.left is already centered, we shift by offset × max_shift
  const maxShiftPct = ((WIDE_RATIO - 1) / 2) / WIDE_RATIO * 100;
  const shiftPct = -offset * maxShiftPct; // invert: tilt right → reveal right → shift wrap left

  // Parallax: slight scale-up as revealing
  const absOff = Math.abs(offset);
  const scale = 1 + absOff * 0.03; // subtle zoom

  const transform = `translateX(${shiftPct}%) scale(${scale})`;

  wrapEls.forEach((wrap, i) => {
    if (!wrap) return;
    wrap.style.transform = transform;

    // Progress bar thumb: 0–100% across track (80px), thumb 24px → range 0–56px
    if (barThumbEls[i]) {
      const pct = (offset + 1) / 2; // 0 to 1
      barThumbEls[i].style.left = `${pct * 56}px`;
    }

    // Flash edges at full reveal
    if (flashEls[i]) {
      flashEls[i].classList.toggle('active', absOff > 0.85);
    }
  });

  // Show/hide reveal bar
  const isRevealing = absOff > 0.05;
  barEls.forEach(bar => {
    if (bar) bar.classList.toggle('visible', isRevealing && revealActive);
  });
}

// ═══════════════════════════════════════════════════
// TOUCH DRAG FALLBACK
// ═══════════════════════════════════════════════════
function enableTouchFallback() {
  document.getElementById('feed').addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
    touchDragging = true;
  }, { passive: true });

  document.getElementById('feed').addEventListener('touchmove', e => {
    if (!touchDragging || !revealActive) return;
    const dx = e.touches[0].clientX - touchStartX;
    // ±120px drag = full ±1 offset
    targetOffset = Math.max(-1, Math.min(1, -dx / 120));
  }, { passive: true });

  document.getElementById('feed').addEventListener('touchend', () => {
    touchDragging = false;
    if (revealActive) targetOffset = 0; // spring back
  }, { passive: true });
}

// ═══════════════════════════════════════════════════
// TOGGLE
// ═══════════════════════════════════════════════════
function toggleReveal() {
  revealActive = !revealActive;
  const btn = document.getElementById('reveal-toggle');

  if (revealActive) {
    btn.classList.add('active');
    baseGamma = null; // recalibrate

    // Start sensors on first tap (requires user gesture)
    startSensors();
    // Start fail-check timer (only fires if no real data arrives)
    if (window._startSensorCheck) window._startSensorCheck();

    if (!sensorStarted || !sensorAvail) {
      showHint('↔ Drag left or right to reveal');
    } else {
      showHint('↔ Tilt phone to reveal');
    }
  } else {
    btn.classList.remove('active');
    targetOffset = 0;
  }
}

function showHint(text) {
  const hint = document.getElementById('tilt-hint');
  hint.innerHTML = `
    <svg class="hint-icon" viewBox="0 0 60 60" fill="none">
      <rect x="18" y="8" width="24" height="44" rx="5" stroke="white" stroke-width="2.5" fill="none"/>
      <path d="M10 30 L18 30 M42 30 L50 30" stroke="rgba(255,149,0,0.9)" stroke-width="2.5" stroke-linecap="round"/>
      <polyline points="12,26 8,30 12,34" stroke="rgba(255,149,0,0.9)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="48,26 52,30 48,34" stroke="rgba(255,149,0,0.9)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <p>${text}</p>`;
  hint.classList.add('show');
  setTimeout(() => hint.classList.remove('show'), 2500);
}

// ═══════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════
buildFeed();
startRafLoop();
enableTouchFallback(); // always enable as secondary fallback

// Handle feed scroll for playback
document.getElementById('feed').addEventListener('scroll', () => {
  playVisible();
  // Recalibrate gamma when switching slides
  baseGamma = null;
  targetOffset = 0;
}, { passive: true });
</script>
<div id="dbg" style="position:fixed;top:8px;left:8px;z-index:999;background:rgba(0,0,0,0.7);color:#0f0;font-size:11px;font-family:monospace;padding:4px 8px;border-radius:6px;pointer-events:none;">sensor: waiting...</div>
</body>
</html>
