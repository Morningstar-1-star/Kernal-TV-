<script>
(()=>{
const TOKEN='eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiIzMTU1ZmRiNDk3Zjc1NzVhMTQ0ZjI2YWRlYmNiZjk4MCIsIm5iZiI6MTc3NTcwNjIzNy43NDUsInN1YiI6IjY5ZDcyMDdkNmJiYTRiYzAzOTEwNjI2ZSIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ._4WdklzSx9za_YAGeMlABQ1jMEOPCLa6mEWtGQLqrw0',JWU='https://yellow-meadow-06cc.ggam1097.workers.dev',META=3,JIKAN='https://api.jikan.moe/v4';

/* ---------- network ---------- */

const mem={};
async function cached(k,ttl,fn){const m=mem[k];if(m&&Date.now()-m.t<ttl)return m.v;const l=LS.get('c_'+k,null);if(l&&Date.now()-l.t<ttl){mem[k]=l;return l.v}const v=await fn();mem[k]={t:Date.now(),v};LS.set('c_'+k,mem[k]);return v}
